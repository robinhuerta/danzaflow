<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Bailarina en arabesque (vista lateral, mirando a la derecha) -->

  <!-- Moño (bun) -->
  <circle cx="20" cy="9"  r="3.2" fill="#e9d5ff"/>
  <!-- Cabeza -->
  <circle cx="22" cy="14" r="4.8" fill="#e9d5ff"/>

  <!-- Cuerpo (torso inclinado hacia adelante) -->
  <path d="M22,19 C21,26 21,31 23,38"
        stroke="#e9d5ff" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Brazo delantero (extendido hacia adelante) -->
  <path d="M21,25 C16,25 10,24 7,22"
        stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Brazo trasero (extendido hacia atrás / arriba) -->
  <path d="M23,25 C29,22 35,20 40,18"
        stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Pierna de apoyo (vertical, ligeramente arqueada) -->
  <path d="M23,38 C23,45 23,51 24,57"
        stroke="#e9d5ff" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Pierna arabesque (elevada hacia atrás) -->
  <path d="M23,38 C33,34 43,29 56,24"
        stroke="#e9d5ff" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Punta del pie (pie de apoyo, en punta) -->
  <path d="M24,57 C25,59 27,61 30,60"
        stroke="#e9d5ff" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
